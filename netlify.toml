# vibemarketer — Netlify + Next.js (pnpm monorepo)
# Manual deploy: npx netlify login && npx netlify init && npx netlify deploy --build --prod

[build]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter web build"
  publish = "apps/web/.next"
  # Netlify Next runtime picks up App Router / API routes from the Next build.

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--version"
  # Set secrets in Netlify UI or: npx netlify env:import .env
  # NEXT_PUBLIC_SITE_URL must be https://vibemarketer.fun in production.

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Optional: longer functions for screen / ingest (plan limits apply on free tier)
[functions]
  node_bundler = "esbuild"
